[package]
name = "fastfill-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["gui", "native-camera"]
gui = [
    "dep:iced", "dep:iced_runtime", "dep:rfd", "pdf-import", "pdf",
    "krilla/raster-images",
    "dep:wasm-bindgen",
]
pdf-import = ["dep:hayro"]
pdf = ["dep:krilla"]
native-camera = ["dep:nokhwa", "dep:rscam"]

[dependencies]
hayro = { version = "0.8.0", optional = true, default-features = false,
    features = ["embed-fonts", "embed-cmaps"] }
iced = { version = "0.14.0", optional = true, features = [
    "advanced",
    "canvas",
    "fira-sans",
    "image-without-codecs",
] }
# Iced's allocator re-export requires its all-codecs image feature.
# Use the already-transitive runtime instead of adding unused image codecs.
iced_runtime = { version = "0.14.0", optional = true }
image = { version = "0.25.8", default-features = false, features = [
    "jpeg",
    "png",
] }
krilla = { version = "0.8.2", default-features = false, optional = true }
rfd = { version = "0.16.0", optional = true, features = [
    "file-handle-inner",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
time = { version = "0.3.55", features = [
    "serde-well-known", "wasm-bindgen",
] }
uuid = { version = "1.28.0", features = ["serde", "v4", "js"] }
zip = { version = "9.0.3", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomicwrites = "0.4.4"
nokhwa = { version = "0.10.11", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, optional = true,
    features = ["input-msmf"] }

[target.'cfg(target_os = "linux")'.dependencies]
rscam = { version = "0.5.5", features = ["no_wrapper"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.129", optional = true }

[lints.rust]
unsafe_code = "deny"

# Keep debug symbols/assertions; optimize our per-pixel correction loops too.
[profile.dev]
opt-level = 1

# Image/PDF codecs benefit from stronger optimization without slower app edits.
[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
all = "deny"
pedantic = "deny"

[[bin]]
name = "fastfill-rust"
path = "src/main.rs"
required-features = ["gui"]

[[example]]
name = "camera_probe"
required-features = ["native-camera"]
