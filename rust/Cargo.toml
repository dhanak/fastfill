[package]
name = "fastfill-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["gui"]
gui = ["dep:iced", "dep:rfd", "pdf-import"]
pdf-import = ["dep:hayro"]
pdf = ["dep:krilla"]

[dependencies]
hayro = { version = "0.8.0", optional = true, default-features = false,
    features = ["embed-fonts", "embed-cmaps"] }
iced = { version = "0.14.0", optional = true, features = [
    "advanced",
    "canvas",
    "fira-sans",
    "image-without-codecs",
] }
image = { version = "0.25.8", default-features = false, features = [
    "jpeg",
    "png",
] }
krilla = { version = "0.8.2", default-features = false, optional = true }
rfd = { version = "0.16.0", optional = true, features = [
    "file-handle-inner",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
time = { version = "0.3.55", features = [
    "serde-well-known", "wasm-bindgen",
] }
uuid = { version = "1.28.0", features = ["serde", "v4", "js"] }
zip = { version = "9.0.3", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomicwrites = "0.4.4"

[lints.rust]
unsafe_code = "deny"

# Keep application code debuggable, but run image/PDF codecs at useful speed.
[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
all = "deny"
pedantic = "deny"

[[bin]]
name = "fastfill-rust"
path = "src/main.rs"
required-features = ["gui"]
