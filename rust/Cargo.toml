[package]
name = "fastfill-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["gui"]
gui = ["dep:iced", "dep:rfd"]

[dependencies]
iced = { version = "0.14.0", optional = true, features = [
    "canvas",
    "fira-sans",
    "image-without-codecs",
] }
image = { version = "0.25.8", default-features = false, features = [
    "jpeg",
    "png",
] }
rfd = { version = "0.16.0", optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[[bin]]
name = "fastfill-rust"
path = "src/main.rs"
required-features = ["gui"]
