[tools]
rust = "1.99.0"
"cargo:trunk" = "0.21.14"
osv-scanner = "latest"

[tools.mdformat]
version = "latest"
with = [
  "mdformat-deflist",
  "mdformat-footnote",
  "mdformat-frontmatter",
  "mdformat-gfm",
  "mdformat-toc",
]

[tool_alias]
mdformat = "pypi:mdformat"

[tasks.web]
description = "Serve FastFill in the browser on LAN port 24800"
# Avoid stale incremental WASM objects with unresolved internal symbols.
env = { NO_COLOR = "true", CARGO_INCREMENTAL = "0" }
run = """
trunk serve --address 0.0.0.0 --port 24800 \
  --no-autoreload true
"""
