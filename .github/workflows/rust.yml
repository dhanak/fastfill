name: Rust prototype

on:
  push:
    paths:
      - ".github/workflows/rust.yml"
      - "rust/**"
      - "docs/samples/fastfill-camera-sample-form.pdf"
      - "tests/samples/**"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "rust/**"
      - "docs/samples/fastfill-camera-sample-form.pdf"
      - "tests/samples/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep caches small; local debug builds and test assertions stay unchanged.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test-native:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: >-
          rustup toolchain install 1.99.0
          --profile minimal
          --component clippy,rustfmt
      - name: Cache native dependencies and compiled tests
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: >-
            native-${{ runner.os }}-${{ runner.arch }}-rust199-lean-v1-${{
            hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-rust199-lean-v1-
      - name: Check formatting
        run: cargo +1.99.0 fmt --check
      - name: Test platform-independent logic
        run: cargo +1.99.0 test --no-default-features
      - name: Test application state and GUI input
        run: cargo +1.99.0 test --all-features --all-targets
      - name: Lint
        if: runner.os == 'Linux'
        run: >-
          cargo +1.99.0 clippy
          --all-targets --all-features -- -D warnings
      - name: Test browser download adapter
        if: runner.os == 'Linux'
        run: node web/download.test.mjs
      - name: Test development release automation
        if: runner.os == 'Linux'
        run: node tools/publish-dev.test.mjs
      - name: Test CI cache configuration
        if: runner.os == 'Linux'
        run: node tools/cache.test.mjs

  package-web:
    name: Browser static archive
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      NO_COLOR: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Configure output
        run: >-
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/fastfill-rust-web-target"
          >> "$GITHUB_ENV"
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 wasm32-unknown-unknown
      - name: Cache browser dependencies and compiled outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/trunk
            ${{ runner.temp }}/fastfill-rust-web-target
          key: >-
            web-${{ runner.os }}-${{ runner.arch }}-rust199-trunk02114-v1-${{
            hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            web-${{ runner.os }}-${{ runner.arch }}-rust199-trunk02114-v1-
      - name: Fetch pinned Trunk binary
        run: |
          archive="$RUNNER_TEMP/trunk.tar.gz"
          url=https://github.com/trunk-rs/trunk/releases/download/v0.21.14
          curl --fail --location --silent --show-error \
            "$url/trunk-x86_64-unknown-linux-gnu.tar.gz" -o "$archive"
          printf '%s  %s\n' \
            f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" trunk
      - name: Build optimized browser app
        run: >-
          "$RUNNER_TEMP/trunk" build --release --locked --all-features
          --public-url ./ --dist "$RUNNER_TEMP/fastfill-rust-web-dist"
      - name: Package and smoke-test extracted browser app
        run: node tools/package-web.mjs
      - name: Upload deployable browser archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/FastFill-Rust-web.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Windows portable archive
    runs-on: windows-2025
    defaults:
      run:
        working-directory: rust
        shell: pwsh
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: >-
        -C target-feature=+crt-static -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Configure output and check package script syntax
        run: |
          $targetDir = Join-Path $env:RUNNER_TEMP "fastfill-rust-target"
          "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV
          $script = Get-Content ./tools/package-windows.ps1 -Raw
          [ScriptBlock]::Create($script) | Out-Null
      - name: Install release toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Cache release dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/fastfill-rust-target
          key: >-
            win-rust199-static-v1-${{
            hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            win-rust199-static-v1-
      - name: Build optimized standalone Windows app
        run: >-
          cargo +1.99.0 build --locked --release --all-features
          --target x86_64-pc-windows-msvc --bin fastfill-rust
      - name: Sign Windows app
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/master'
        env:
          CERTIFICATE_BASE64: >-
            ${{ secrets.FASTFILL_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: >-
            ${{ secrets.FASTFILL_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64 -or
              -not $env:CERTIFICATE_PASSWORD) {
            throw "Existing FastFill signing certificate is not configured."
          }
          $executable = Join-Path $env:CARGO_TARGET_DIR `
            "x86_64-pc-windows-msvc/release/fastfill-rust.exe"
          $pfxPath = Join-Path $env:RUNNER_TEMP "FastFill.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $sdkBin = Join-Path `
              ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $signTool = Get-ChildItem `
              (Join-Path $sdkBin "*\x64\signtool.exe") |
              Sort-Object { [version]$_.Directory.Parent.Name } |
              Select-Object -Last 1
            if (-not $signTool) { throw "SignTool was not found." }
            & $signTool.FullName sign `
              /fd SHA256 `
              /f $pfxPath `
              /p $env:CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              $executable
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed."
            }
            $signature = Get-AuthenticodeSignature `
              -LiteralPath $executable
            if (-not $signature.SignerCertificate) {
              throw "Signed executable has no signer certificate."
            }
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Package and smoke-test extracted app
        run: ./tools/package-windows.ps1
      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/FastFill-Rust-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Linux portable archive
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Configure output
        run: >-
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/fastfill-rust-linux-target"
          >> "$GITHUB_ENV"
      - name: Install release toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Cache release dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/fastfill-rust-linux-target
          key: >-
            linux-${{ runner.os }}-${{ runner.arch }}-rust199-v1-${{
            hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            linux-${{ runner.os }}-${{ runner.arch }}-rust199-v1-
      - name: Build optimized Linux app
        run: >-
          cargo +1.99.0 build --locked --release --all-features
          --bin fastfill-rust
      - name: Package and smoke-test extracted app
        run: bash ./tools/package-linux.sh
      - name: Upload portable Linux archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/FastFill-Rust-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: macOS universal archive
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Configure output
        run: >-
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/fastfill-rust-macos-target"
          >> "$GITHUB_ENV"
      - name: Install Rust and both macOS targets
        run: |
          rustup toolchain install 1.99.0 --profile minimal \
            --component clippy,rustfmt
          rustup target add --toolchain 1.99.0 \
            x86_64-apple-darwin aarch64-apple-darwin
      - name: Cache macOS dependencies and compiled outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/fastfill-rust-macos-target
          key: >-
            macos-${{ runner.os }}-${{ runner.arch }}-rust199-v1-${{
            hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            macos-${{ runner.os }}-${{ runner.arch }}-rust199-v1-
      - name: Check formatting
        run: cargo +1.99.0 fmt --check
      - name: Test platform-independent logic
        run: cargo +1.99.0 test --no-default-features
      - name: Test application state and GUI input
        run: cargo +1.99.0 test --all-features --all-targets
      - name: Build Intel and Apple Silicon apps
        run: |
          cargo +1.99.0 build --locked --release --all-features \
            --target x86_64-apple-darwin --bin fastfill-rust
          cargo +1.99.0 build --locked --release --all-features \
            --target aarch64-apple-darwin --bin fastfill-rust
      - name: Package and smoke-test extracted macOS app
        run: bash ./tools/package-macos.sh
      - name: Upload portable macOS ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/FastFill-Rust-macos-universal.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  # Publish only after all platform archives and shared checks pass.
  publish-dev:
    name: Publish rust-dev
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master'
    needs: [test-native, package-web, package-windows, package-linux,
            package-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested Windows ZIP
        uses: actions/download-artifact@v8
        with:
          name: FastFill-Rust-windows-x64.zip
          skip-decompress: true
      - name: Download tested Linux archive
        uses: actions/download-artifact@v8
        with:
          name: FastFill-Rust-linux-x64.tar.gz
          skip-decompress: true
      - name: Download tested macOS ZIP
        uses: actions/download-artifact@v8
        with:
          name: FastFill-Rust-macos-universal.zip
          skip-decompress: true
      - name: Download tested browser archive
        uses: actions/download-artifact@v8
        with:
          name: FastFill-Rust-web.tar.gz
          skip-decompress: true
      - name: Publish Rust development build
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          windows=FastFill-Rust-windows-x64.zip
          linux=FastFill-Rust-linux-x64.tar.gz
          macos=FastFill-Rust-macos-universal.zip
          web=FastFill-Rust-web.tar.gz
          for archive in "$windows" "$linux" "$macos" "$web"; do
            test -s "$archive" || {
              echo "::error::Missing or empty archive: $archive" >&2
              exit 1
            }
          done
          title="FastFill Rust development build"
          notes="Experimental Rust prototype at ${GITHUB_SHA}."
          if gh release view rust-dev >/dev/null 2>&1; then
            gh release upload rust-dev "$windows" "$linux" \
              "$macos" "$web" --clobber
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/rust-dev" \
              -f "sha=${GITHUB_SHA}" -F force=true >/dev/null
            gh release edit rust-dev --prerelease --latest=false \
              --title "$title" --notes "$notes"
          else
            gh release create rust-dev \
              "$windows" "$linux" "$macos" "$web" \
              --prerelease --latest=false --target "${GITHUB_SHA}" \
              --title "$title" --notes "$notes"
          fi
