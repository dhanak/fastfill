name: Rust prototype

on:
  push:
    paths:
      - ".github/workflows/rust.yml"
      - "rust/**"
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "rust/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: >-
          rustup toolchain install 1.99.0
          --profile minimal
          --component clippy,rustfmt
      - name: Check formatting
        run: cargo +1.99.0 fmt --check
      - name: Test platform-independent logic
        run: cargo +1.99.0 test --no-default-features
      - name: Test application state and GUI input
        run: cargo +1.99.0 test --all-features
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo +1.99.0 clippy
          --all-targets --all-features -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 wasm32-unknown-unknown
      - name: Check WASM GUI
        run: >-
          cargo +1.99.0 check
          --target wasm32-unknown-unknown
