name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FastFill.slnx
      - name: Run portable checks
        run: >-
          dotnet run --project src/FastFill.Checks
          -c Release --no-restore
      - name: Publish portable app
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "FastFill"
          dotnet publish src/FastFill.App `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -o $output
          if ($LASTEXITCODE -ne 0) {
            throw "Portable publish failed."
          }
          $executable = Join-Path $output "FastFill.exe"
          if (-not (Test-Path $executable)) {
            throw "Portable executable was not created."
          }
      - name: Sign portable app
        if: >-
          github.ref == 'refs/heads/master' &&
          github.event_name != 'pull_request'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: >-
            ${{ secrets.FASTFILL_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: >-
            ${{ secrets.FASTFILL_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) {
            throw "FASTFILL_CERTIFICATE_BASE64 is not configured."
          }
          if (-not $env:CERTIFICATE_PASSWORD) {
            throw "FASTFILL_CERTIFICATE_PASSWORD is not configured."
          }

          $output = Join-Path $env:RUNNER_TEMP "FastFill"
          $executable = Join-Path $output "FastFill.exe"
          $pfxPath = Join-Path $env:RUNNER_TEMP "FastFill.pfx"
          $cerPath = Join-Path $output "FastFill.cer"
          $pfxBytes = [Convert]::FromBase64String(
            $env:CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $certificate = $null
          try {
            $certType =
              [Security.Cryptography.X509Certificates.X509Certificate2]
            $keyFlags =
              [Security.Cryptography.X509Certificates.X509KeyStorageFlags]
            $certificate = $certType::new(
              $pfxPath,
              $env:CERTIFICATE_PASSWORD,
              $keyFlags::EphemeralKeySet)
            $contentType =
              [Security.Cryptography.X509Certificates.X509ContentType]
            $cerBytes = $certificate.Export($contentType::Cert)
            [IO.File]::WriteAllBytes($cerPath, $cerBytes)

            $sdkBin = Join-Path `
              ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $signTool = Get-ChildItem `
              (Join-Path $sdkBin "*\x64\signtool.exe") |
              Sort-Object { [version]$_.Directory.Parent.Name } |
              Select-Object -Last 1
            if (-not $signTool) {
              throw "SignTool was not found."
            }

            & $signTool.FullName sign `
              /fd SHA256 `
              /f $pfxPath `
              /p $env:CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              $executable
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed."
            }
            Write-Host "Portable executable signing complete."
          }
          finally {
            if ($certificate) {
              $certificate.Dispose()
            }
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Upload portable app
        uses: actions/upload-artifact@v7
        with:
          name: FastFill-portable
          path: ${{ runner.temp }}/FastFill/**
          if-no-files-found: error

  publish:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download portable app
        uses: actions/download-artifact@v8
        with:
          name: FastFill-portable
          path: FastFill
      - name: Create portable archive
        run: zip -rq FastFill-portable.zip FastFill
      - name: Publish public development build
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev" \
              -f "sha=${GITHUB_SHA}" \
              -F force=true >/dev/null
            gh release upload dev FastFill-portable.zip --clobber
            gh release delete-asset dev FastFill.exe --yes || true
            gh release delete-asset dev FastFill-msix.zip --yes || true
          else
            gh release create dev FastFill-portable.zip \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "FastFill development build" \
              --notes "Latest successful master build."
          fi
