name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    env:
      CERTIFICATE_BASE64: ${{ secrets.FASTFILL_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.FASTFILL_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: dotnet restore FastFill.slnx
      - name: Run portable checks
        run: >-
          dotnet run --project src/FastFill.Checks
          -c Release --no-restore
      - name: Compile WinUI app
        run: >-
          dotnet build src/FastFill.App
          -c Release --no-restore
          -p:Platform=x64
          -p:AppxPackageSigningEnabled=false
      - name: Prepare signing certificate
        shell: pwsh
        run: |
          using namespace System.Security.Cryptography.X509Certificates

          $pfx = Join-Path $env:RUNNER_TEMP "FastFill.pfx"
          $cer = Join-Path $env:RUNNER_TEMP "FastFill.cer"
          if ($env:CERTIFICATE_BASE64) {
            $bytes = [Convert]::FromBase64String(
              $env:CERTIFICATE_BASE64)
            [IO.File]::WriteAllBytes($pfx, $bytes)
            $password = $env:CERTIFICATE_PASSWORD
            $flags = [X509KeyStorageFlags]::EphemeralKeySet
            $certificate = [X509Certificate2]::new(
              $pfx,
              $password,
              $flags)
            $publicBytes = $certificate.Export(
              [X509ContentType]::Cert)
            [IO.File]::WriteAllBytes($cer, $publicBytes)
            $certificate.Dispose()
          } else {
            $password = [Guid]::NewGuid().ToString("N")
            $securePassword = ConvertTo-SecureString `
              -String $password `
              -AsPlainText `
              -Force
            $certificateArgs = @{
              Type = "Custom"
              Subject = "CN=FastFill Development"
              FriendlyName = "FastFill CI development certificate"
              CertStoreLocation = "Cert:\CurrentUser\My"
              KeyUsage = "DigitalSignature"
              KeyExportPolicy = "Exportable"
              HashAlgorithm = "SHA256"
              NotAfter = [DateTime]::Now.AddDays(30)
              TextExtension = @(
                "2.5.29.37={text}1.3.6.1.5.5.7.3.3"
                "2.5.29.19={text}"
              )
            }
            $certificate = New-SelfSignedCertificate @certificateArgs
            $pfxArgs = @{
              Cert = $certificate
              FilePath = $pfx
              Password = $securePassword
            }
            Export-PfxCertificate @pfxArgs | Out-Null
            Export-Certificate `
              -Cert $certificate `
              -FilePath $cer | Out-Null
            "CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "PACKAGE_CERTIFICATE_PATH=$pfx" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_CERTIFICATE_PASSWORD=$password" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build signed MSIX
        shell: pwsh
        run: |
          $passwordArgument = "/p:PackageCertificatePassword=" + `
            $env:PACKAGE_CERTIFICATE_PASSWORD
          $arguments = @(
            "src/FastFill.App/FastFill.App.csproj"
            "/restore"
            "/p:Configuration=Release"
            "/p:Platform=x64"
            "/p:GenerateAppxPackageOnBuild=true"
            "/p:AppxBundle=Never"
            "/p:UapAppxPackageBuildMode=SideloadOnly"
            "/p:AppxPackageSigningEnabled=true"
            "/p:GenerateAppInstallerFile=false"
            "/p:AppxPackageDir=$env:RUNNER_TEMP\FastFillPackages\"
            "/p:PackageCertificateKeyFile=$env:PACKAGE_CERTIFICATE_PATH"
            $passwordArgument
          )
          & msbuild @arguments
      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item $env:PACKAGE_CERTIFICATE_PATH -ErrorAction Ignore
          if ($env:CERTIFICATE_THUMBPRINT) {
            Remove-Item `
              "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" `
              -ErrorAction Ignore
          }
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: FastFill-msix
          path: |
            ${{ runner.temp }}/FastFillPackages/**
            ${{ runner.temp }}/FastFill.cer
          if-no-files-found: error
