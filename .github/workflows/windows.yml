name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v3
      - name: Restore
        run: dotnet restore FastFill.slnx
      - name: Run portable checks
        run: >-
          dotnet run --project src/FastFill.Checks
          -c Release --no-restore
      - name: Compile WinUI app
        run: >-
          dotnet build src/FastFill.App
          -c Release --no-restore
          -p:Platform=x64
          -p:AppxPackageSigningEnabled=false
      - name: Build MSIX
        shell: pwsh
        run: |
          $arguments = @(
            "src/FastFill.App/FastFill.App.csproj"
            "/restore"
            "/p:Configuration=Release"
            "/p:Platform=x64"
            "/p:GenerateAppxPackageOnBuild=true"
            "/p:AppxBundle=Never"
            "/p:UapAppxPackageBuildMode=SideloadOnly"
            "/p:AppxPackageSigningEnabled=false"
            "/p:GenerateAppInstallerFile=false"
            "/p:AppxPackageDir=$env:RUNNER_TEMP\FastFillPackages\"
          )
          & msbuild @arguments
      - name: Sign MSIX
        shell: pwsh
        env:
          CERTIFICATE_BASE64: >-
            ${{ secrets.FASTFILL_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: >-
            ${{ secrets.FASTFILL_CERTIFICATE_PASSWORD }}
        run: |
          $missingCertificate = -not $env:CERTIFICATE_BASE64 -or
            -not $env:CERTIFICATE_PASSWORD
          if ($missingCertificate) {
            throw "FastFill signing certificate secrets are required."
          }

          $pfx = Join-Path $env:RUNNER_TEMP "FastFill.pfx"
          $cer = Join-Path $env:RUNNER_TEMP "FastFill.cer"
          $certificate = $null
          try {
            try {
              $bytes = [Convert]::FromBase64String(
                $env:CERTIFICATE_BASE64)
            } catch {
              throw "FASTFILL_CERTIFICATE_BASE64 is invalid."
            }
            [IO.File]::WriteAllBytes($pfx, $bytes)
            $securePassword = ConvertTo-SecureString `
              -String $env:CERTIFICATE_PASSWORD `
              -AsPlainText `
              -Force
            $importArgs = @{
              FilePath = $pfx
              Password = $securePassword
              CertStoreLocation = "Cert:\CurrentUser\My"
            }
            $certificate = Import-PfxCertificate @importArgs
            if ($certificate.Subject -ne "CN=FastFill Development") {
              throw "Signing certificate has the wrong subject."
            }
            Export-Certificate `
              -Cert $certificate `
              -FilePath $cer | Out-Null

            $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
            $signTool = Get-ChildItem `
                $kitRoot `
                -Filter "signtool.exe" `
                -Recurse |
              Where-Object FullName -Match "\\x64\\" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw "Windows SDK SignTool was not found."
            }
            $packages = Get-ChildItem `
              "$env:RUNNER_TEMP\FastFillPackages" `
              -Filter "FastFill.App_*.msix" `
              -Recurse
            if (-not $packages) {
              throw "MSIX package was not created."
            }
            foreach ($package in $packages) {
              & $signTool.FullName sign `
                /fd SHA256 `
                /f $pfx `
                /p $env:CERTIFICATE_PASSWORD `
                $package.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "SignTool failed for $($package.Name)."
              }
              Copy-Item `
                $cer `
                (Join-Path $package.DirectoryName "FastFill.cer") `
                -Force
            }
          } finally {
            Remove-Item $pfx -ErrorAction Ignore
            if ($certificate) {
              Remove-Item `
                "Cert:\CurrentUser\My\$($certificate.Thumbprint)" `
                -ErrorAction Ignore
            }
          }
      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: FastFill-msix
          path: ${{ runner.temp }}/FastFillPackages/**
          if-no-files-found: error

  publish:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download installable package
        uses: actions/download-artifact@v8
        with:
          name: FastFill-msix
          path: FastFillPackages
      - name: Create public archive
        run: zip -r FastFill-msix.zip FastFillPackages
      - name: Publish public development build
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev" \
              -f "sha=${GITHUB_SHA}" \
              -F force=true >/dev/null
            gh release upload dev FastFill-msix.zip --clobber
          else
            gh release create dev FastFill-msix.zip \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "FastFill development build" \
              --notes "Latest successful master build."
          fi
