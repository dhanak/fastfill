<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FastFill app</title>
    <link data-trunk rel="icon" type="image/png" href="assets/AppIcon.png">
    <link data-trunk rel="copy-dir" href="assets/icons/lucide"
      data-target-path="icons">
    <link data-trunk rel="copy-dir" href="assets/fonts/license"
      data-target-path="licenses/liberation">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      canvas {
        touch-action: none;
      }
    </style>
    <script>
      // Winit prevents default on canvas keydown; leave F11 to the browser.
      window.addEventListener("keydown", (event) => {
        if (event.key === "F11") {
          event.stopPropagation();
        }
      }, true);
    </script>
    <link data-trunk rel="rust" data-bin="fastfill">
  </head>
  <body></body>
</html>
